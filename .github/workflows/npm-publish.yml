name: Publish to npm

# This branch (npm) is the package root -- no android-project/, no docs/,
# no shared history with main. Tag a version here and this workflow ships
# it to the npm registry so `npm install @horizon-ark-studio/arkware`
# resolves without anyone needing the main branch's contents at all.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dist_tag:
        description: "npm dist-tag to publish under"
        required: false
        default: "latest"

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout npm branch
        uses: actions/checkout@v4
        with:
          ref: npm

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install
        # No package-lock.json is committed (deps are minimal), so `npm ci`
        # isn't available -- plain install, and skip lifecycle scripts
        # since `prepare` calls sync-from-main.js, which this CI run
        # doesn't need (publish ships repo contents as-is).
        run: npm install --ignore-scripts

      - name: Publish
        run: >
          npm publish --access public --provenance
          ${{ github.event.inputs.dist_tag && format('--tag {0}', github.event.inputs.dist_tag) || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
