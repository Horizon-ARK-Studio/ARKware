# Builds the Android shell described in android-project/README.md.
# GitHub Actions only discovers workflow files at a repo's top level,
# which is why this lives here instead of under android-project/.
#
# What this does, per product flavor declared in
# android-project/app/build.gradle.kts (youtube, template, and any
# new flavor added later -- the matrix below is the only place that
# needs a new entry when a flavor is added):
#   1. assembles a debug APK
#   2. smoke-tests it: boots a headless emulator, installs the APK,
#      launches it, and fails the job if it crashes on launch
#   3. assembles a release APK -- unsigned unless the four
#      RELEASE_KEYSTORE_* secrets below are configured for this repo
#
# Optional signing secrets (Settings -> Secrets and variables ->
# Actions). Release builds succeed and upload an unsigned APK when
# these aren't set; they're picked up automatically once they are:
#   RELEASE_KEYSTORE_BASE64    -- your .jks/.keystore file, base64-encoded
#   RELEASE_KEYSTORE_PASSWORD
#   RELEASE_KEY_ALIAS
#   RELEASE_KEY_PASSWORD

name: Android build

on:
  push:
    branches: [main]
    paths:
      - "android-project/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android-project/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: android-project

jobs:
  debug-and-smoke-test:
    name: Debug build + smoke test (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [youtube, template]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble ${{ matrix.flavor }} debug APK
        run: ./gradlew "assemble${{ matrix.flavor }}Debug" --stacktrace

      - name: Locate debug APK
        id: apk
        run: |
          apk=$(find app/build/outputs/apk -iname "*${{ matrix.flavor }}*debug*.apk" | head -n1)
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arkware-${{ matrix.flavor }}-debug
          path: ${{ steps.apk.outputs.path }}

      # Smoke test: install + launch on a headless AVD. Enable KVM so
      # the emulator isn't running fully software-rendered on the
      # GitHub-hosted runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install + launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            package=$(./gradlew -q "printApplicationId${{ matrix.flavor }}Debug" 2>/dev/null || echo "com.horizonarkstudio.arkware.${{ matrix.flavor }}")
            adb install -r "${{ steps.apk.outputs.path }}"
            adb shell monkey -p "$package" -c android.intent.category.LAUNCHER 1
            sleep 5
            adb shell dumpsys activity activities | grep -q "$package" || (echo "::error::$package did not come to the foreground after launch" && exit 1)

  release:
    name: Release build (${{ matrix.flavor }})
    needs: debug-and-smoke-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [youtube, template]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # Decode the release keystore only if the secret is configured.
      # RELEASE_KEYSTORE_PATH being unset/empty is exactly what
      # build.gradle.kts's isNullOrBlank() check falls back on to
      # produce an unsigned APK instead.
      - name: Decode release keystore
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Assemble ${{ matrix.flavor }} release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew "assemble${{ matrix.flavor }}Release" --stacktrace

      - name: Locate release APK
        id: apk
        run: |
          apk=$(find app/build/outputs/apk -iname "*${{ matrix.flavor }}*release*.apk" | head -n1)
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: arkware-${{ matrix.flavor }}-release${{ secrets.RELEASE_KEYSTORE_BASE64 == '' && '-unsigned' || '' }}
          path: ${{ steps.apk.outputs.path }}
